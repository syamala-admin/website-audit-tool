name: CodeAgent Validation
on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main, master, develop, development]
    paths-ignore: ['**/*.md', 'docs/**']

concurrency:
  group: codeagent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - run: npm run build --if-present
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - run: npm test --if-present
        env:
          CI: true
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - run: npm run lint --if-present
  # End-to-end acceptance tests (the use cases). Runs on the PR so a failing test
  # is caught and fixed BEFORE merge, and again on the merge to main (the run the
  # tool records). It's the heavy job, so cost is held down by concurrency's
  # cancel-in-progress (a new push kills the previous PR run) and the md/docs
  # paths-ignore above. Starts the app in the runner, drives it with Playwright,
  # and uploads the report as an artifact (14-day retention).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Detect e2e suite
        id: e2e
        run: |
          if [ -d e2e ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No e2e/ suite found — skipping end-to-end tests."
          fi
      - run: npm ci || npm install
        if: steps.e2e.outputs.present == 'true'
      - run: npm run build --if-present
        if: steps.e2e.outputs.present == 'true'
      - name: Install Playwright
        if: steps.e2e.outputs.present == 'true'
        run: npm i -D @playwright/test && npx playwright install --with-deps chromium
      - name: Start app and wait
        if: steps.e2e.outputs.present == 'true'
        run: |
          (npm start &) || (npm run dev &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 >/dev/null 2>&1 && break
            sleep 2
          done
      - name: Run end-to-end tests
        if: steps.e2e.outputs.present == 'true'
        env:
          BASE_URL: http://localhost:3000
          CI: true
        run: npx playwright test
      - name: Upload Playwright report
        if: always() && steps.e2e.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

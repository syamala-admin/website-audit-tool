<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Website Audit Tool</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h1>Website Audit Tool</h1>

    <section id="audit-form-section">
      <h2>Run an audit</h2>
      <form id="audit-form">
        <label for="url-input">Website URL</label>
        <input type="url" id="url-input" name="url" placeholder="https://example.com" required />
        <button type="submit">Run audit</button>
      </form>
      <p id="audit-status"></p>
    </section>

    <section id="recent-audits-section">
      <h2>Recent audits</h2>
      <p id="audit-count" data-testid="audit-count"></p>
      <ul id="recent-audits-list"></ul>
      <p id="no-audits-message" hidden>No audits yet.</p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>

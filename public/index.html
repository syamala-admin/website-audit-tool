<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Audit Tool</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Website Audit Tool</h1>
    <p>Enter a client URL to scan it for technical, SEO, form, and tracking issues.</p>

    <form id="audit-form">
      <label for="url-input">Website URL</label>
      <input type="url" id="url-input" name="url" placeholder="https://example.com" required>
      <button type="submit" id="submit-btn">Submit</button>
    </form>

    <div id="error-banner" class="error-banner" hidden></div>

    <div id="loading" class="loading" hidden>Scanning URL, please wait...</div>

    <section id="report-container"></section>

    <div id="save-task-container" hidden>
      <button id="save-task-btn">Save as Task</button>
      <div id="task-result"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Website Audit Tool</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <h1>Website Audit Tool</h1>
    <p>Enter a client's website URL to run a technical, SEO, form, and tracking audit.</p>

    <form id="audit-form">
      <label for="url-input">Website URL</label>
      <input id="url-input" name="url" type="text" placeholder="https://example.com" required />
      <button id="submit-btn" type="submit">Audit</button>
    </form>

    <div id="status" class="status" hidden></div>

    <div id="report-actions" class="report-actions" hidden>
      <button id="print-btn" type="button">Print</button>
      <button id="download-btn" type="button">Download HTML</button>
    </div>

    <div id="report-container"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
